# docker compose up --build   ->  UI: http://localhost:8080   API/Swagger: http://localhost:5045/swagger
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Passw0rd!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/RequestsManagement.Api/Dockerfile
    environment:
      ConnectionStrings__Default: "Server=sql,1433;Database=RequestsManagement;User Id=sa;Password=Local_Dev_Passw0rd!;TrustServerCertificate=True"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "5045:8080"
    depends_on:
      sql:
        condition: service_healthy

  web:
    build:
      context: web
    ports:
      - "8080:80"
    depends_on:
      - api
