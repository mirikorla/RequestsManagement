# Runs on every push and pull request. Three independent jobs:
#   backend  - build + all 37 tests; integration tests use a real SQL Server in Docker (Testcontainers)
#   frontend - clean npm install, Angular unit tests (Vitest) and a production build
#   docker   - docker compose up of SQL Server + API + web, then a real request through nginx
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build RequestsManagement.slnx --configuration Release

      # No INTEGRATION_SQL here, so the integration tests start their own SQL Server container.
      - name: Test
        run: |
          dotnet test RequestsManagement.slnx --configuration Release --no-build \
            --logger "console;verbosity=normal" --logger "trx" --results-directory TestResults

      # Counts come from the test result files, so the summary shows what actually ran.
      - name: Test summary
        if: always()
        run: |
          total=0; passed=0; failed=0
          for f in TestResults/*.trx; do
            t=$(grep -o 'total="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            p=$(grep -o 'passed="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            x=$(grep -o 'failed="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            total=$((total+t)); passed=$((passed+p)); failed=$((failed+x))
          done
          echo "### Backend tests: $passed / $total passed, $failed failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Integration tests ran against a real SQL Server container (Testcontainers)." >> "$GITHUB_STEP_SUMMARY"
          echo "passed=$passed total=$total failed=$failed"

  frontend:
    name: Angular tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --configuration production

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start SQL Server, API and web
        run: docker compose up --build --detach

      # The API applies migrations and seeds 100,000 requests on first start, so allow a few minutes.
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail http://localhost:5045/health; then echo; echo "API is up"; exit 0; fi
            sleep 5
          done
          echo "API did not start in time"; exit 1

      - name: Request through the web container (nginx proxies /api to the API)
        run: |
          if ! curl --silent --fail http://localhost:8080/ | grep -q "<app-root"; then
            echo "The Angular app is not served on port 8080"; exit 1
          fi
          echo "UI is served"

          curl --silent --fail "http://localhost:8080/api/requests?pageSize=1" > /tmp/page.json
          if ! grep -q '"totalCount":100000' /tmp/page.json; then
            echo "Expected 100,000 requests through /api, got:"; cat /tmp/page.json; exit 1
          fi
          echo "100,000 requests seeded and returned through the web container"

          {
            echo "### Docker Compose smoke test"
            echo "- SQL Server, API and web containers started"
            echo "- Angular app served by nginx on port 8080"
            echo "- \`GET /api/requests\` through nginx returned \`totalCount: 100000\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down --volumes
